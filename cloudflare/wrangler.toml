name = "a4c-c3-scheduler"
main = "worker.mjs"
compatibility_date = "2026-10-30"
workers_dev = true

[vars]
C3_ENABLED = "true"
# Production Paris slots, including the two catch-up attempts.
C3_PARIS_SLOTS = "07:37,10:37,14:37"

[triggers]
# The worker selects its Paris slots, including daylight-saving changes.
crons = ["37 * * * *"]
