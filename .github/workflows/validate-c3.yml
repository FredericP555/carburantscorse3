name: C3 validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements.lock.txt"
      - "cloudflare/**"
      - "maquette/app.js"
      - "maquette/index.html"
      - "verify_ui.cjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'FredericP555/carburantscorse3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt
      - name: Check failure recovery, boundaries, history and exports
        run: |
          python -B -m unittest test_automation test_year_rollover test_regressions test_pages_health test_collect_current test_r2_inputs
          node cloudflare/test_worker.mjs
          node verify_ui.cjs
      - name: Revalidate the latest published day with official sources
        run: |
          target=$(python -c 'import json; print(json.load(open("data/current.json"))["end"])')
          python -B daily_refresh.py --run "check${{ github.run_id }}" --target "$target"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-validation-${{ github.run_id }}
          path: automation-artifacts/
          if-no-files-found: warn
          retention-days: 90
